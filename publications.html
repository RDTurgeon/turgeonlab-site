<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Publications - Turgeon Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; background-color: #FAFAFA; color: #565656; margin: 0; }
    header, footer { background-color: #FF0000; color: white; padding: 1em; text-align: center; }
    header h1, header nav a { color: white; }
    nav a { margin: 0 1em; text-decoration: none; font-weight: bold; }
    h1 { font-family: 'Poppins', sans-serif; color: #AD1122; }
    main { padding: 2em; max-width: 900px; margin: auto; }
    ul { list-style-type: none; padding-left: 0; }
    li { margin-bottom: 1.5em; }
    li a { font-weight: bold; color: #AD1122; text-decoration: none; }
    li small { display: block; margin-top: 0.2em; color: #565656; }
  </style>
</head>
<body>
  <header>
    <h1>Our Publications</h1>
    <nav>
      <a href="https://www.rickyturgeon.com/index.html">Home</a>
      <a href="https://www.rickyturgeon.com/publications.html">Our Publications</a>
      <a href="https://www.decisionaids.ca">Our Decision Aids</a>
      <a href="https://www.rickyturgeon.com/contact.html">Contact Us</a>
    </nav>
  </header>

  <main>
    <ul id="pubmed-list"></ul>
    <script>
      const authorQuery = "Turgeon Ricky[Author] OR Turgeon RD[Author]";
      const baseURL = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/";
      const listEl = document.getElementById("pubmed-list");

      async function fetchAllPublications() {
        try {
          const searchURL = `${baseURL}esearch.fcgi?db=pubmed&term=${encodeURIComponent(authorQuery)}&retmode=json&retmax=200`;
          const searchResponse = await fetch(searchURL);
          const searchData = await searchResponse.json();
          const ids = searchData.esearchresult.idlist;

          if (ids.length === 0) {
            listEl.innerHTML = "<li>No publications found.</li>";
            return;
          }

          const summaryURL = `${baseURL}esummary.fcgi?db=pubmed&id=${ids.join(',')}&retmode=json`;
          const summaryResponse = await fetch(summaryURL);
          const summaryData = await summaryResponse.json();

          ids.forEach(id => {
            const pub = summaryData.result[id];
            if (pub) {
              const li = document.createElement("li");
              li.innerHTML = `<a href="https://pubmed.ncbi.nlm.nih.gov/${id}/" target="_blank">${pub.title}</a><small>${pub.fulljournalname}, ${pub.pubdate}</small>`;
              listEl.appendChild(li);
            }
          });
        } catch (err) {
          listEl.innerHTML = "<li>Error loading publications.</li>";
        }
      }

      fetchAllPublications();
    </script>

    <p>
      Also available on:<br>
      <a href="https://scholar.google.com/citations?user=F8kyylkAAAAJ&hl" target="_blank">Google Scholar</a><br>
      <a href="https://orcid.org/0000-0002-3967-1528" target="_blank">ORCID</a>
    </p>
  </main>

  <footer>
    &copy; 2025 Turgeon Lab. All rights reserved.
  </footer>
</body>
</html>
